[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinci-media"
version = "0.1.0"
description = "FFmpeg media ops (Phase 2)."
requires-python = ">=3.11"
license = { text = "MIT" }
# Pillow draws burned-in subtitles (vinci_media.episode), so exports need no ffmpeg drawtext/libass.
dependencies = ["vinci-protocol==0.1.0", "pillow>=10.1"]

[tool.setuptools.packages.find]
include = ["vinci_media*"]

[tool.setuptools.package-data]
vinci_media = ["py.typed"]
