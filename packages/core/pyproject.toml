[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinci-core"
version = "0.1.0"
description = "Vinci config, credential resolver, catalog, and cost primitives."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["vinci-protocol==0.1.0", "tomli>=2.0; python_version < '3.11'"]

[tool.setuptools.packages.find]
include = ["vinci_core*"]

[tool.setuptools.package-data]
vinci_core = ["py.typed", "catalogs/*.json", "templates/*.json"]
