[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinci-index"
version = "0.1.0"
description = "Asset index + sqlite-vec (Phase 2)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["vinci-protocol==0.1.0"]

[tool.setuptools.packages.find]
include = ["vinci_index*"]

[tool.setuptools.package-data]
vinci_index = ["py.typed"]
