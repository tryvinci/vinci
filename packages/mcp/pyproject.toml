[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinci-mcp"
version = "0.1.0"
description = "Authored MCP server tools and external MCP provider adapter."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "vinci-protocol==0.1.0",
    "vinci-runtime==0.1.0",
    "vinci-core==0.1.0",
    "vinci-provider-sdk==0.1.0",
]

[tool.setuptools.packages.find]
include = ["vinci_mcp*"]

[tool.setuptools.package-data]
vinci_mcp = ["py.typed"]
