[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinci-provider-sdk"
version = "0.1.0"
description = "Vinci provider plugin ABC, mock provider, and conformance suite."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["vinci-protocol==0.1.0", "vinci-core==0.1.0", "vinci-storage==0.1.0"]

[tool.setuptools.packages.find]
include = ["vinci_provider_sdk*"]

[tool.setuptools.package-data]
vinci_provider_sdk = ["py.typed", "fixtures/*"]
