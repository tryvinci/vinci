[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinci-provider-magnific"
version = "0.1.0"
description = "Magnific HTTP plugin (x-magnific-api-key). Not MCP."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["vinci-protocol==0.1.0", "vinci-provider-sdk==0.1.0", "vinci-core==0.1.0"]

[tool.setuptools.packages.find]
include = ["vinci_provider_magnific*"]

[tool.setuptools.package-data]
vinci_provider_magnific = ["py.typed"]
