[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinci-provider-higgsfield"
version = "0.1.0"
description = "Higgsfield HTTP plugin (key + secret). Not MCP."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["vinci-protocol==0.1.0", "vinci-provider-sdk==0.1.0", "vinci-core==0.1.0"]

[tool.setuptools.packages.find]
include = ["vinci_provider_higgsfield*"]

[tool.setuptools.package-data]
vinci_provider_higgsfield = ["py.typed"]
