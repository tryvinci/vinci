[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinci-skills"
version = "0.1.0"
description = "Skill loader and registry client."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["vinci-protocol==0.1.0", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
include = ["vinci_skills*"]

[tool.setuptools.package-data]
vinci_skills = ["py.typed"]
