 Tomas: at the right of the frame, turned toward frame left. Mira: Young lighthouse keeper, about 17. Short dark-brown hair, amber eyes, a long red scarf, a navy duffle coat over a cream cable sweater, a brown plaid skirt, dark grey socks, brown lace-up boots. Left of the lamp, the oil can in both hands. Tomas: The old lighthouse keeper, about 70. White beard, grey hair under a dark-green knitted cap, small round glasses, a brown scarf, a yellow-brown oilskin coat with dark-blue shoulder and elbow patches over a brown waistcoat with a watch chain, dark-blue trousers, black rubber boots, a brass lantern. Right of the lamp, the lantern held low. Prop: A dented tin oil can with a long spout and a brass cap. Prop: The great lamp. A tall brass drum of ring-shaped glass prisms around a brass oil burner with a thick braided wick, on a round stone pedestal. Location: Lamp room, night. A round glass room at the top of the tower. The great lamp and its ring lens stand at the centre. The sea on all sides. Build the real place from these words, with real materials and wear. The grey shapes stand for real things of the same size in the same place: the lamp pedestal (a cylinder, in the middle at the bottom); the great lamp lens (a cylinder, in the middle); the lamp cap (a cone, in the middle at the top); the window post 3 (a box, on the left); the window post 4 (a box, in the middle); the window post 5 (a box, on the right). Build each one as its real object: no cone, ball, plain box or untextured surface stays in the picture.\n\nCamera: Wide shot, eye level angle, 24mm lens. Mira stands at frame left and Tomas at frame right. They face each other. The camera is 1.4 m above the floor and looks down 5°, 3.5 m from Mira, 3.6 m from Tomas. From left to right: Mira, then Tomas, as on their side of the scene's line.\n\nLook: Style: medium 2D anime; palette #1d2b44, #f2b25c, #c9563c, #e9e2d0; grade blue dusk shadows, warm lamp light, soft contrast; grain none. Mood: hushed, then warm.\