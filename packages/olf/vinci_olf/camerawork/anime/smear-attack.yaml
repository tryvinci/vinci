id: anime/smear-attack
version: 1
family: action
name: Smear attack
notation: Obake
intent: A fast attack with smear frames and effects.
camera: { move: static, render: model }
framing: [medium, wide]
timing: { default: 1+12, min: 0+12, max: 2+12 }
slots: [a]
prompt: >
  {a} attacks very fast. The arms and legs smear into streaks for a few frames, with
  impact effects.
avoid: [slow motion]
