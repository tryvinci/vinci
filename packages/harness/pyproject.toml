[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinci-harness"
version = "0.1.0"
description = "Meta-install for Vinci OSS (core + runtime + providers). Local entry: python -m vinci_harness demo."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "vinci-protocol==0.1.0",
    "vinci-core==0.1.0",
    "vinci-storage==0.1.0",
    "vinci-provider-sdk==0.1.0",
    "vinci-runtime==0.1.0",
    "vinci-media==0.1.0",
    "vinci-index==0.1.0",
    "vinci-mcp==0.1.0",
    "vinci-skills==0.1.0",
    "vinci-provider-wavespeed==0.1.0",
    "vinci-provider-google==0.1.0",
    "vinci-provider-fal==0.1.0",
    "vinci-provider-elevenlabs==0.1.0",
]

[project.scripts]
vinci-harness = "vinci_harness.__main__:main"

[tool.setuptools.packages.find]
include = ["vinci_harness*"]

[tool.setuptools.package-data]
vinci_harness = ["py.typed"]
