id: "@tryvinci/clip-select"
version: "1.0.0"
preference: cheapest
nodes:
  - id: transcribe
    type: media
    params:
      op: transcribe
      media: "{{inputs.media}}"
  - id: select
    type: media
    params:
      op: select_windows
      transcript: "{{nodes.transcribe.data}}"
      query: "{{inputs.query}}"
  - id: cut
    type: media
    params:
      op: cut
      media: "{{inputs.media}}"
      windows: "{{nodes.select.data}}"
edges:
  - src: transcribe
    dst: select
  - src: select
    dst: cut
