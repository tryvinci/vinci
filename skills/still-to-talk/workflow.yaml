id: "@tryvinci/still-to-talk"
version: "1.0.0"
preference: cheapest
nodes:
  - id: still
    type: generate
    capability: t2i
    params:
      prompt: "{{inputs.prompt}}"
      aspect_ratio: "{{inputs.aspect_ratio}}"
      camera: "{{inputs.camera}}"
      lens: "{{inputs.lens}}"
      look: "{{inputs.look}}"
      aperture: "{{inputs.aperture}}"
      genre: "{{inputs.genre}}"
      lighting: "{{inputs.lighting}}"
      palette: "{{inputs.palette}}"
      scene: "{{inputs.scene}}"
  - id: talk
    type: generate
    capability: i2v
    params:
      prompt: "{{inputs.prompt}}"
      image: "{{nodes.still.output}}"
      duration: "{{inputs.duration}}"
      aspect_ratio: "{{inputs.aspect_ratio}}"
      camera: "{{inputs.camera}}"
      lens: "{{inputs.lens}}"
      look: "{{inputs.look}}"
      aperture: "{{inputs.aperture}}"
      genre: "{{inputs.genre}}"
      lighting: "{{inputs.lighting}}"
      palette: "{{inputs.palette}}"
      scene: "{{inputs.scene}}"
edges:
  - src: still
    dst: talk
    input_key: image
